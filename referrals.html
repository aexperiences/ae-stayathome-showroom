<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referral CRM · Stay@Home OS</title>
<meta name="description" content="The B2B book — discharge planners, case managers, elder law, hospice. Cadence, touches and conversion.">
<link rel="canonical" href="https://www.aexperiences.com/apps/stayathome/referrals.html">
<meta property="og:title" content="Referral CRM · Stay@Home OS">
<meta property="og:description" content="The B2B book — discharge planners, case managers, elder law, hospice. Cadence, touches and conversion.">
<meta property="og:image" content="https://www.aexperiences.com/StayAtHome_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<meta name="theme-color" content="#2e7f7c">
<link rel="stylesheet" href="stayathome.css">
</head>
<body>
<script src="stayathome.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.StayAtHome;
  var content = S.mount({ active:"referrals.html", crumb:"Referral CRM" });
  content.appendChild(S.page("Referral CRM",
    "Home care volume comes from professionals who send you people, not from advertising. This book keeps those relationships " +
    "from going cold quietly.",
    '<button class="btn" id="addRef">+ Add a source</button>'));
  
  var host = document.createElement("div"); content.appendChild(host);
  function render(){
    host.innerHTML = "";
    var rs = S.db().referrers;
    var overdue = rs.filter(S.referralOverdue);
    var ytd = rs.reduce(function(a,r){ return a + (r.ytd||0); }, 0);
    var conv = rs.reduce(function(a,r){ return a + (r.converted||0); }, 0);
  
    host.appendChild(S.card(
      '<div class="stats">' +
        S.stat("Referrals YTD", ytd, "Across " + rs.length + " sources") +
        S.stat("Converted", conv, S.pct(ytd? conv/ytd*100:0) + " of everything sent", "good") +
        S.stat("Past cadence", overdue.length, overdue.length ? "Drifting — log a touch" : "Every relationship is current", overdue.length ? "watch" : "good") +
        S.stat("Best source", (S.topReferrers()[0]||{}).org || "—", (S.topReferrers()[0]||{}).converted + " clients from one relationship") +
      '</div>'
    ));
  
    host.appendChild(S.card(
      '<h2>The book</h2>' +
      '<p class="sub">Sorted by what has actually turned into clients — not by how recently someone called.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Source</th><th>Type</th><th>Contact</th>' +
      '<th class="right">Sent</th><th class="right">Converted</th><th>Rate</th><th>Last touch</th><th></th></tr></thead><tbody>' +
      S.topReferrers().map(function(r){
        var od = S.referralOverdue(r), since = Math.abs(S.daysUntil(r.lastTouch)||0);
        var cv = S.referralConversion(r);
        return '<tr class="' + (od?"row-warn":"") + '"><td><b>' + S.esc(r.org) + '</b>' +
            (r.note ? '<div class="muted small">' + S.esc(r.note) + '</div>' : '') + '</td>' +
          '<td>' + S.esc(r.type) + '</td>' +
          '<td>' + S.esc(r.contact) + '<div class="muted small">' + S.esc(r.phone) + '</div></td>' +
          '<td class="right mono">' + r.ytd + '</td>' +
          '<td class="right mono">' + r.converted + '</td>' +
          '<td style="min-width:120px">' + S.pct(cv) + S.bar(cv, "var(--tang)") + '</td>' +
          '<td class="mono small">' + (r.cadenceDays ? (since + ' days ago' + (od ? ' ' + S.tag("overdue","watch") : '')) : '<span class="muted">no cadence</span>') + '</td>' +
          '<td class="right"><button class="btn ghost" data-touch="' + r.id + '">Log a touch</button></td></tr>';
      }).join("") + '</tbody></table></div>'
    ));
  
    host.appendChild(S.card(
      '<h2>Where clients actually came from</h2>' +
      '<div class="tablewrap"><table><thead><tr><th>Referral type</th><th class="right">Sent</th><th class="right">Converted</th><th>Share</th></tr></thead><tbody>' +
      S.REFERRER_TYPES.map(function(t){
        var mine = rs.filter(function(r){ return r.type===t; });
        if (!mine.length) return "";
        var sent = mine.reduce(function(a,r){return a+r.ytd;},0), c = mine.reduce(function(a,r){return a+r.converted;},0);
        return '<tr><td>' + S.esc(t) + '</td><td class="right mono">' + sent + '</td><td class="right mono">' + c + '</td>' +
          '<td style="min-width:150px">' + S.bar(ytd? sent/ytd*100:0, "var(--gold)") + '</td></tr>';
      }).join("") + '</tbody></table></div>'
    ));
  
    Array.prototype.forEach.call(host.querySelectorAll("[data-touch]"), function(b){
      b.addEventListener("click", function(){
        var n = prompt("What happened? (optional note)");
        S.logTouch(b.getAttribute("data-touch"), n || "");
        S.toast("Touch logged. The cadence clock resets.", "ok"); render();
      });
    });
  }
  render();
  document.getElementById("addRef").addEventListener("click", function(){
    var org = prompt("Organisation"); if (!org) return;
    S.save(function(d){
      d.referrers.push({ id:"rf"+Date.now().toString(36), org:org,
        contact: prompt("Contact name")||"", type: prompt("Type — e.g. " + S.REFERRER_TYPES.slice(0,3).join(", "))||"Word of mouth",
        phone: prompt("Phone")||"", city: S.db().agency.city, lastTouch:S.iso(S.TODAY),
        cadenceDays: parseInt(prompt("Contact cadence in days","21")||"21",10), ytd:0, converted:0, note:"" });
    });
    S.toast("Added to the book.", "ok"); render();
  });
})();
</script>
</body>
</html>
