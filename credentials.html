<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credentials · Stay@Home OS</title>
<meta name="description" content="Background, CPR, TB, training hours — expiry-dated, with a lapse that pulls a caregiver off the schedule.">
<link rel="canonical" href="https://www.aexperiences.com/apps/stayathome/credentials.html">
<meta property="og:title" content="Credentials · Stay@Home OS">
<meta property="og:description" content="Background, CPR, TB, training hours — expiry-dated, with a lapse that pulls a caregiver off the schedule.">
<meta property="og:image" content="https://www.aexperiences.com/StayAtHome_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<meta name="theme-color" content="#2e7f7c">
<link rel="stylesheet" href="stayathome.css">
</head>
<body>
<script src="stayathome.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.StayAtHome;
  var content = S.mount({ active:"credentials.html", crumb:"Credentials" });
  content.appendChild(S.page("Credentials",
    "Expiry-dated, worst first. A lapsed required credential is not a reminder — it removes the caregiver from the match engine entirely.",
    ''));
  
  var host = document.createElement("div"); content.appendChild(host);
  function render(){
    host.innerHTML = "";
    var issues = S.credIssues();
    var blocked = S.cannotBeScheduled();
    var sbb = S.scheduledButBlocked();
  
    host.appendChild(S.card(
      '<div class="stats">' +
        S.stat("Blocked from the schedule", blocked.length, blocked.length ? blocked.map(function(c){return c.name;}).join(", ") : "Everyone is clear to work", blocked.length ? "bad" : "good") +
        S.stat("Already on the schedule", sbb.length, sbb.length ? "Shifts assigned to a blocked caregiver — remove them" : "No conflicts", sbb.length ? "bad" : "good") +
        S.stat("Expiring", issues.filter(function(i){return i.status.state==="expiring";}).length, "Inside " + S.CRED_WARN_DAYS + " days", "watch") +
        S.stat("Expired or missing", issues.filter(function(i){return i.status.state!=="expiring";}).length, "Action required now", "bad") +
      '</div>'
    ));
  
    if (sbb.length) {
      host.appendChild(S.card(
        '<h2 class="warn">On the schedule but not clear to work</h2>' +
        '<p class="sub">This is the finding an auditor writes up. Reassign these before the shift runs.</p>' +
        '<div class="tablewrap"><table><thead><tr><th>When</th><th>Caregiver</th><th>Client</th><th>Why</th><th></th></tr></thead><tbody>' +
        sbb.map(function(x){
          return '<tr><td class="mono">' + S.dayLabel(x.shift.date) + ' ' + S.hhmm(x.shift.start) + '</td>' +
            '<td><b>' + S.esc(x.caregiver.name) + '</b></td>' +
            '<td>' + S.esc(x.client ? x.client.name : "") + '</td>' +
            '<td>' + x.why.map(function(w){ return S.tag(w,"bad"); }).join(" ") + '</td>' +
            '<td class="right"><button class="btn ghost" data-clear="' + x.shift.id + '">Clear the assignment</button></td></tr>';
        }).join("") + '</tbody></table></div>', "alert"
      ));
    }
  
    host.appendChild(S.card(
      '<h2>Everything due, worst first</h2>' +
      '<div class="tablewrap"><table><thead><tr><th>Caregiver</th><th>Credential</th><th>State</th><th class="right">When</th><th>What it means</th></tr></thead><tbody>' +
      (issues.length ? issues.map(function(i){
        var band = i.status.state === "expiring" ? "watch" : "bad";
        var when = i.status.state === "missing" ? "not on file"
                 : i.status.days < 0 ? Math.abs(i.status.days) + " days ago"
                 : "in " + i.status.days + " days";
        return '<tr><td><b>' + S.esc(i.caregiver.name) + '</b><div class="muted small">' + S.esc(i.caregiver.status) + '</div></td>' +
          '<td>' + S.esc(i.cred.k) + (i.cred.required ? ' ' + S.tag("required","") : ' <span class="muted small">conditional</span>') + '</td>' +
          '<td>' + S.tag(i.status.state, band) + '</td>' +
          '<td class="right mono">' + when + '</td>' +
          '<td class="muted small">' + S.esc(i.cred.required && i.status.state !== "expiring"
              ? "Blocks scheduling until it is renewed." : i.cred.note) + '</td></tr>';
      }).join("") : '<tr><td colspan="5" class="muted">Nothing due. Every credential is current.</td></tr>') +
      '</tbody></table></div>'
    ));
  
    host.appendChild(S.card(
      '<h2>The full roster</h2>' +
      '<div class="tablewrap"><table class="grid"><thead><tr><th>Caregiver</th>' +
      S.CREDS.map(function(c){ return '<th class="vert">' + S.esc(c.k) + '</th>'; }).join("") + '</tr></thead><tbody>' +
      S.db().caregivers.map(function(cg){
        return '<tr><td><b>' + S.esc(cg.name) + '</b><div class="muted small">' + S.esc(cg.city) + ' · hired ' + S.esc(cg.hired) + '</div></td>' +
          S.CREDS.map(function(c){
            var st = S.credStatus(cg, c.k);
            var sym = st.state === "complete" ? "✓" : st.state === "current" ? "✓" : st.state === "expiring" ? "!" :
                      st.state === "expired" ? "✕" : st.state === "missing" ? "–" : "·";
            var cls = st.state === "expired" || st.state === "missing" ? "bad" : st.state === "expiring" ? "watch" :
                      (st.state === "complete" || st.state === "current") ? "good" : "";
            var t = st.value === "complete" ? "complete" : st.value ? st.value : (c.required ? "not on file" : "not applicable");
            return '<td class="cell ' + cls + '" title="' + S.esc(c.k + ": " + t) + '">' + sym + '</td>';
          }).join("") + '</tr>';
      }).join("") + '</tbody></table></div>' +
      '<div class="srcnote">Cycle lengths are this agency\'s policy: ' +
      S.CREDS.filter(function(c){return c.cycleMo;}).map(function(c){ return S.esc(c.k) + " every " + c.cycleMo + " mo"; }).join(" · ") + '.</div>'
    ));
  
    Array.prototype.forEach.call(host.querySelectorAll("[data-clear]"), function(b){
      b.addEventListener("click", function(){
        S.assignShift(b.getAttribute("data-clear"), null);
        S.toast("Assignment cleared. The shift is open — fill it from the Schedule room.", "ok"); render();
      });
    });
  }
  render();
})();
</script>
</body>
</html>
