<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · Stay@Home OS</title>
<meta name="description" content="Every visit, on a calendar you can subscribe to from your phone.">
<link rel="canonical" href="https://www.aexperiences.com/apps/stayathome/calendar.html">
<meta property="og:title" content="Calendar · Stay@Home OS">
<meta property="og:description" content="Every visit, on a calendar you can subscribe to from your phone.">
<meta property="og:image" content="https://www.aexperiences.com/StayAtHome_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<meta name="theme-color" content="#2e7f7c">
<link rel="stylesheet" href="stayathome.css">
</head>
<body>
<script src="stayathome.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.StayAtHome;
  var content = S.mount({ active:"calendar.html", crumb:"Calendar" });
  content.appendChild(S.page("Calendar",
    "Every scheduled visit. Subscribe once and it keeps itself current on your phone — Apple Calendar, Google Calendar, Outlook.",
    '<a class="btn" href="stayathome.ics" download>Subscribe to the feed</a>'));
  
  var host = document.createElement("div"); content.appendChild(host);
  var offset = 0;
  
  function render(){
    host.innerHTML = "";
    var start = S.addDays(new Date(S.thisWeek()+"T12:00:00"), offset*7);
    var wk = S.iso(start);
    var days = []; for (var i=0;i<7;i++) days.push(S.iso(S.addDays(start,i)));
  
    host.appendChild(S.card(
      '<div class="cardhead"><h2>Week of ' + S.dayLabel(wk) + '</h2>' +
      '<div class="rowbtns"><button class="btn ghost" id="prev">‹ Previous</button>' +
      '<button class="btn ghost" id="today">This week</button>' +
      '<button class="btn ghost" id="next">Next ›</button></div></div>' +
      '<div class="cal">' + days.map(function(d){
        var rows = S.db().shifts.filter(function(s){ return s.date===d; })
          .sort(function(a,b){ return a.start < b.start ? -1 : 1; });
        var isToday = d === S.iso(S.TODAY);
        return '<div class="cal-day' + (isToday?" today":"") + '"><div class="cal-h">' + S.dayLabel(d) + '</div>' +
          (rows.length ? rows.map(function(s){
            var cl = S.clientById(s.clientId), open = !s.caregiverId;
            return '<div class="cal-e' + (open?" open":"") + '" style="border-left-color:' + S.lineColor(s.line) + '">' +
              '<div class="ce-t mono">' + S.hhmm(s.start) + '–' + S.hhmm(s.end) + '</div>' +
              '<div class="ce-c">' + S.esc(cl?cl.name:"") + '</div>' +
              '<div class="ce-g">' + (open ? "OPEN — needs a caregiver" : S.esc(S.caregiverName(s.caregiverId))) + '</div></div>';
          }).join("") : '<div class="cal-none">—</div>') + '</div>';
      }).join("") + '</div>'
    ));
  
    host.appendChild(S.card(
      '<h2>Put it on your phone</h2>' +
      '<div class="split2">' +
        '<div><h3>iPhone / iPad</h3><ol class="steps">' +
          '<li>Settings → Calendar → Accounts → Add Account → Other</li>' +
          '<li>Add Subscribed Calendar</li>' +
          '<li>Paste the feed address and save</li></ol></div>' +
        '<div><h3>Google Calendar</h3><ol class="steps">' +
          '<li>Open Google Calendar on a computer</li>' +
          '<li>Other calendars → + → From URL</li>' +
          '<li>Paste the feed address and add</li></ol></div>' +
      '</div>' +
      '<p class="muted small">Subscribing is not the same as downloading. A subscribed calendar refreshes itself; a downloaded ' +
      'file is a snapshot that goes stale the moment the schedule changes.</p>'
    ));
  
    host.querySelector("#prev").addEventListener("click", function(){ offset--; render(); });
    host.querySelector("#next").addEventListener("click", function(){ offset++; render(); });
    host.querySelector("#today").addEventListener("click", function(){ offset = 0; render(); });
  }
  render();
})();
</script>
</body>
</html>
