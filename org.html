<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Org · Bus · Stay@Home OS</title>
<meta name="description" content="The five AI department chains, the event bus, and the confidence gates that decide what reaches a human.">
<link rel="canonical" href="https://www.aexperiences.com/apps/stayathome/org.html">
<meta property="og:title" content="Agent Org · Bus · Stay@Home OS">
<meta property="og:description" content="The five AI department chains, the event bus, and the confidence gates that decide what reaches a human.">
<meta property="og:image" content="https://www.aexperiences.com/StayAtHome_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<meta name="theme-color" content="#2e7f7c">
<link rel="stylesheet" href="stayathome.css">
</head>
<body>
<script src="stayathome.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.StayAtHome;
  var content = S.mount({ active:"org.html", crumb:"Agent Org · Bus" });
  content.appendChild(S.page("The agent org",
    "Five departments, each a chain: a department head, an executive who keeps the desk, and a triad that does the thinking. " +
    "Conclusions route up; work routes down and across.", ''));
  
  content.appendChild(S.card(
    '<div class="cardhead"><h2>' + S.esc(S.BRAIN.name) + '</h2><span class="tag">' + S.esc(S.BRAIN.role) + '</span></div>' +
    '<p>' + S.esc(S.BRAIN.line) + '</p>'
  ));
  
  content.appendChild(S.card(
    '<h2>The departments</h2>' +
    '<div class="tablewrap"><table><thead><tr><th>Department</th><th>Head</th><th>Desk</th><th>What it watches</th></tr></thead><tbody>' +
    S.SEATS.map(function(s){
      return '<tr><td><b>' + S.esc(s.dept) + '</b></td><td>' + S.esc(s.dh) + '</td><td>' + S.esc(s.ae) + '</td>' +
        '<td class="muted small">' + S.esc(s.focus) + '</td></tr>';
    }).join("") + '</tbody></table></div>'
  ));
  
  content.appendChild(S.card(
    '<h2>How a conclusion travels</h2>' +
    '<p class="sub">A conclusion is a stance, a confidence number, and two or three reasons — each tagged as data or assumption. ' +
    'A malformed one is rejected, never faked. Below the gate it is marked "needs a human" and routed up rather than dressed up.</p>' +
    '<ol class="steps">' +
      '<li><b>Triad</b> — two opposing lenses that never confer, plus a pacemaker who is the only voice out.</li>' +
      '<li><b>Pacemaker gate</b> — nothing leaves the triad until it clears its confidence bar.</li>' +
      '<li><b>Executive</b> — packages it, files it, keeps the follow-ups.</li>' +
      '<li><b>Department head</b> — owns the verdict and the "so what", talks laterally to the other heads.</li>' +
      '<li><b>COO</b> — wraps everything into one decision at a time before it reaches you.</li>' +
    '</ol>'
  ));
  
  var b = S.bus();
  content.appendChild(S.card(
    '<h2>The event bus</h2>' +
    '<p class="sub">Everything that happened in this hub, newest first. Use the rooms and watch it fill.</p>' +
    '<div class="tablewrap"><table><tbody>' +
    (b.length ? b.map(function(e){
      return '<tr><td class="mono small">' + S.esc(e.ts.replace("T"," ")) + '</td>' +
        '<td>' + S.tag(e.dept,"") + '</td><td>' + S.esc(e.msg) + '</td></tr>';
    }).join("") : '<tr><td class="muted">Nothing on the bus yet. Assign a shift, clock a visit in, or move an applicant.</td></tr>') +
    '</tbody></table></div>'
  ));
  
  content.appendChild(S.card(
    '<h2>Systems — what is native and what is not</h2>' +
    '<p class="sub">Named honestly. Four things genuinely need an outside party, and pretending otherwise would be the kind of ' +
    'claim that gets an agency in trouble.</p>' +
    '<div class="tablewrap"><table><thead><tr><th>Capability</th><th>Where it runs</th><th>Detail</th></tr></thead><tbody>' +
    S.db().systems.map(function(s){
      return '<tr><td><b>' + S.esc(s.k) + '</b></td>' +
        '<td>' + S.tag(s.state, s.state==="Native"?"good":"watch") + '</td>' +
        '<td class="muted small">' + S.esc(s.note) + '</td></tr>';
    }).join("") + '</tbody></table></div>'
  ));
})();
</script>
</body>
</html>
