<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approval Desk · Stay@Home OS</title>
<meta name="description" content="Anything that changes revenue, sends to a family, or commits money waits here instead of happening quietly.">
<link rel="canonical" href="https://www.aexperiences.com/apps/stayathome/approvals.html">
<meta property="og:title" content="Approval Desk · Stay@Home OS">
<meta property="og:description" content="Anything that changes revenue, sends to a family, or commits money waits here instead of happening quietly.">
<meta property="og:image" content="https://www.aexperiences.com/StayAtHome_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/StayAtHome_OS.png">
<meta name="theme-color" content="#2e7f7c">
<link rel="stylesheet" href="stayathome.css">
</head>
<body>
<script src="stayathome.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.StayAtHome;
  var content = S.mount({ active:"approvals.html", crumb:"Approval Desk" });
  content.appendChild(S.page("Approval Desk",
    "The desk should stay nearly empty. If it fills up, the fences are set too tight — the org is meant to clear everything it " +
    "honestly can and bring you only the real decisions.", ''));
  
  var host = document.createElement("div"); content.appendChild(host);
  function render(){
    host.innerHTML = "";
    var open = S.approvals().filter(function(a){ return a.stage === "Awaiting Anthony"; });
    var done = S.approvals().filter(function(a){ return a.stage !== "Awaiting Anthony"; });
  
    host.appendChild(S.card(
      '<div class="stats">' +
        S.stat("Waiting on you", open.length, open.length ? "Each one is a real fence" : "Nothing is waiting", open.length ? "watch" : "good") +
        S.stat("Cleared", done.length, "Decided this session") +
        S.stat("Revenue-affecting", open.filter(function(a){return (a.tags||[]).indexOf("revenue")>=0;}).length, "Route straight to the owner") +
        S.stat("Ready to send", open.filter(function(a){return (a.tags||[]).indexOf("send")>=0;}).length, "Nothing leaves without a decision") +
      '</div>'
    ));
  
    (open.concat(done)).forEach(function(a){
      var settled = a.stage !== "Awaiting Anthony";
      host.appendChild(S.card(
        '<div class="cardhead"><h2>' + S.esc(a.title) + '</h2>' +
        '<span class="tag">' + S.esc(a.dept) + '</span>' +
        (a.tags||[]).map(function(t){ return S.tag(t, t==="revenue"?"watch":""); }).join("") +
        (settled ? S.tag(a.stage, a.stage==="Approved"?"good":"") : '') + '</div>' +
        '<table class="kv"><tbody>' +
          '<tr><th>Why it is being asked</th><td>' + S.esc(a.why) + '</td></tr>' +
          '<tr><th>What happens if you say yes</th><td>' + S.esc(a.impact) + '</td></tr>' +
          '<tr><th>Confidence</th><td class="mono">' + a.conf + '/100 ' + S.bar(a.conf, a.conf>=80?"var(--good)":"var(--watch)") + '</td></tr>' +
        '</tbody></table>' +
        (settled ? '' :
          '<div class="rowbtns"><button class="btn" data-yes="' + a.id + '">Approve</button>' +
          '<button class="btn ghost" data-no="' + a.id + '">Send it back</button></div>')
      ));
    });
  
    host.appendChild(S.card(
      '<h2>What always reaches this desk</h2>' +
      '<ul class="ticks">' +
        '<li>Any change to a client rate or a caregiver pay rate</li>' +
        '<li>Anything that sends to a family, a caregiver or a referral source</li>' +
        '<li>Writing off unbillable hours</li>' +
        '<li>An offer above the pay band</li>' +
        '<li>Ending a client or terminating a caregiver</li>' +
        '<li>Anything that commits money</li>' +
      '</ul>' +
      '<div class="note">Everything else the departments clear themselves. Fewer cards here over time is the scoreboard.</div>'
    ));
  
    Array.prototype.forEach.call(host.querySelectorAll("[data-yes]"), function(b){
      b.addEventListener("click", function(){ S.decideApproval(b.getAttribute("data-yes"), "approve");
        S.toast("Approved.", "ok"); render(); }); });
    Array.prototype.forEach.call(host.querySelectorAll("[data-no]"), function(b){
      b.addEventListener("click", function(){ S.decideApproval(b.getAttribute("data-no"), "return");
        S.toast("Sent back with your note.", "ok"); render(); }); });
  }
  render();
})();
</script>
</body>
</html>
